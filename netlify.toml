[build]
  command = "npm run build"
  publish = "dist"

# Every route is prerendered to a real file, so no SPA fallback rewrite is
# needed. A 404.html is emitted for anything genuinely missing.

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
